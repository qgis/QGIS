version: '3'
services:

  httpbin:
    image: kennethreitz/httpbin:latest

  webdav:
    image: nginx
    volumes:
      - ${QGIS_WORKSPACE}/.docker/webdav/nginx.conf:/etc/nginx/conf.d/default.conf
      - ${QGIS_WORKSPACE}/.docker/webdav/passwords.list:/etc/nginx/.passwords.list
      - /tmp/webdav_tests:/tmp/webdav_tests_root/webdav_tests

  garage:
    image: dxflrs/garage
    volumes:
      - /tmp/s3_tests:/data
    environment:
      - GARAGE_RPC_SECRET=adminio€
      - GARAGE_DEFAULT_ACCESS_KEY=GK0123456789abcdef01234567
      - GARAGE_DEFAULT_SECRET_KEY=testsecretkey123456789
      - GARAGE_DEFAULT_BUCKET=test-bucket
    command: server --single-node --default-bucket
    ports:
      - "3900:3900"

  badssl:
    build:
      context: ./badssl
      dockerfile: Dockerfile
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

  qgis-deps:
    tty: true
    image: qgis3-build-deps-binary-image
    volumes:
      - ${QGIS_WORKSPACE}:/root/QGIS
      - ${QGIS_COMMON_GIT_DIR}:${QGIS_COMMON_GIT_DIR}
    links:
      - webdav
      - garage
      - httpbin
      - badssl
    env_file:
      - docker-variables.env
    environment:
      - LANG=C.UTF-8
      - LC_ALL=en_US.UTF-8
      - QGIS_HTTPBIN_HOST=httpbin
      - QGIS_TEST_ACCEPT_GITSTATUS_CHECK_FAILURE=1
